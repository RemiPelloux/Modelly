<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="The Modelly simulation loop: a scenario configures the model once; every tick the agents act, data is recorded and time advances; after the run the rows are a pandas DataFrame to visualize and analyze.">
  <title>The Modelly simulation loop</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#12B5C9"/>
      <stop offset="1" stop-color="#E0559F"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C5CFF" fill-opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="510" rx="24" fill="#FFFFFF"/>
  <text x="156" y="58" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#7A76A8">BEFORE THE RUN</text>
  <text x="585" y="58" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#7A76A8">EVERY TICK</text>
  <text x="1044" y="58" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#7A76A8">AFTER THE RUN</text>
  <g><rect x="40" y="130" width="232" height="70" rx="14" fill="#FFFFFF" stroke="#E2E4F5" stroke-width="1.2"/><rect x="40" y="130" width="4" height="70" rx="2" fill="#7C5CFF"/><text x="60" y="160" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0C1022">Scenario</text><text x="60" y="182" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#5A6183">WealthScenario(rng=42)</text></g>
  <path d="M156 200 L156 262" fill="none" stroke="#7C5CFF" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="5 6" marker-end="url(#head)"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></path>
  <text x="210" y="236" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#7A76A8">configures</text>
  <g><rect x="40" y="265" width="232" height="70" rx="14" fill="#FFFFFF" stroke="#E2E4F5" stroke-width="1.2"/><rect x="40" y="265" width="4" height="70" rx="2" fill="#7C5CFF"/><text x="60" y="295" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0C1022">Model</text><text x="60" y="317" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#5A6183">WealthModel(scenario)</text></g>
  <path d="M272 300 L445 300" fill="none" stroke="#7C5CFF" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="5 6" marker-end="url(#head)"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></path>
  <text x="369.5" y="290" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#7A76A8">run</text>
  <circle cx="585" cy="300" r="118" fill="none" stroke="#EDEAFB" stroke-width="20"/>
  <path id="tick" d="M585.0 182.0 A118 118 0 0 1 585.0 418.0 A118 118 0 0 1 585.0 182.0" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-opacity="0.7"/>
  <circle r="6" fill="#12B5C9"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#tick"/></animateMotion></circle>
  <text x="585" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#141833">one tick</text>
  <text x="585" y="314" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#7A76A8">model.step()</text>
  <text x="585" y="340" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="13.5" fill="#6B6F96" opacity="1">model.time = 1<animate attributeName="opacity" values="1;0;0;0" keyTimes="0.000;0.250;0.500;0.750" calcMode="discrete" dur="18.0s" repeatCount="indefinite"/></text>
  <text x="585" y="340" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="13.5" fill="#6B6F96" opacity="0">model.time = 2<animate attributeName="opacity" values="0;1;0;0" keyTimes="0.000;0.250;0.500;0.750" calcMode="discrete" dur="18.0s" repeatCount="indefinite"/></text>
  <text x="585" y="340" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="13.5" fill="#6B6F96" opacity="0">model.time = 3<animate attributeName="opacity" values="0;0;1;0" keyTimes="0.000;0.250;0.500;0.750" calcMode="discrete" dur="18.0s" repeatCount="indefinite"/></text>
  <text x="585" y="340" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="13.5" fill="#6B6F96" opacity="0">model.time = 4<animate attributeName="opacity" values="0;0;0;1" keyTimes="0.000;0.250;0.500;0.750" calcMode="discrete" dur="18.0s" repeatCount="indefinite"/></text>
  <g><circle cx="585.0" cy="182.0" r="16" fill="#7C5CFF" opacity="0"><animate attributeName="opacity" values="0;0.25;0;0" keyTimes="0;0.06;0.3;1" dur="4.5s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="585.0" cy="182.0" r="7" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="3"/><text x="585.0" y="122.0" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0C1022" fill-opacity="0.55">agents act<animate attributeName="fill-opacity" values="0.55;1;0.55;0.55" keyTimes="0;0.06;0.3;1" dur="4.5s" begin="0.00s" repeatCount="indefinite"/></text><text x="585.0" y="143.0" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#7C5CFF">agents.shuffle_do("step")</text></g>
  <g><circle cx="687.2" cy="359.0" r="16" fill="#12B5C9" opacity="0"><animate attributeName="opacity" values="0;0.25;0;0" keyTimes="0;0.06;0.3;1" dur="4.5s" begin="1.50s" repeatCount="indefinite"/></circle><circle cx="687.2" cy="359.0" r="7" fill="#FFFFFF" stroke="#12B5C9" stroke-width="3"/><text x="716.6" y="386.0" text-anchor="start" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0C1022" fill-opacity="0.55">record<animate attributeName="fill-opacity" values="0.55;1;0.55;0.55" keyTimes="0;0.06;0.3;1" dur="4.5s" begin="1.50s" repeatCount="indefinite"/></text><text x="716.6" y="407.0" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#12B5C9">datacollector.collect(self)</text></g>
  <g><circle cx="482.8" cy="359.0" r="16" fill="#E0559F" opacity="0"><animate attributeName="opacity" values="0;0.25;0;0" keyTimes="0;0.06;0.3;1" dur="4.5s" begin="3.00s" repeatCount="indefinite"/></circle><circle cx="482.8" cy="359.0" r="7" fill="#FFFFFF" stroke="#E0559F" stroke-width="3"/><text x="453.4" y="386.0" text-anchor="end" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0C1022" fill-opacity="0.55">time += 1<animate attributeName="fill-opacity" values="0.55;1;0.55;0.55" keyTimes="0;0.06;0.3;1" dur="4.5s" begin="3.00s" repeatCount="indefinite"/></text><text x="453.4" y="407.0" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#E0559F">due events fire</text></g>
  <path d="M725 300 L928 300" fill="none" stroke="#7C5CFF" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="5 6" marker-end="url(#head)"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></path>
  <text x="815.5" y="290" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#7A76A8">one row per tick</text>
  <g><rect x="928" y="265" width="232" height="70" rx="14" fill="#FFFFFF" stroke="#E2E4F5" stroke-width="1.2"/><rect x="928" y="265" width="4" height="70" rx="2" fill="#12B5C9"/><text x="948" y="295" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0C1022">DataFrame</text><text x="948" y="317" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#5A6183">get_model_vars_dataframe()</text></g>
  <path d="M1044 335 L1044 397" fill="none" stroke="#7C5CFF" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="5 6" marker-end="url(#head)"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></path>
  <text x="1088" y="371" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#7A76A8">pandas</text>
  <g><rect x="928" y="400" width="232" height="70" rx="14" fill="#FFFFFF" stroke="#E2E4F5" stroke-width="1.2"/><rect x="928" y="400" width="4" height="70" rx="2" fill="#E0559F"/><text x="948" y="430" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0C1022">Visualize · Analyze</text><text x="948" y="452" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#5A6183">Solara · plots · stats</text></g>
</svg>
