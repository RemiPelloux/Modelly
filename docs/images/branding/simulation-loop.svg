<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="The Modelly simulation loop: scenario, step, record, visualize.">
  <title>The Modelly simulation loop</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#12B5C9"/>
      <stop offset="1" stop-color="#E0559F"/>
    </linearGradient>
  </defs>
  <circle cx="500" cy="285" r="142" fill="none" stroke="#EDEAFB" stroke-width="24"/>
  <circle cx="500" cy="285" r="142" fill="none" stroke="#7C5CFF" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="4 10"/>
  <g transform="translate(500 285)"><circle r="142" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="214 892" transform="rotate(-60)"/></g>
  <text x="500" y="281" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#141833">one tick</text>
  <text x="500" y="309" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="13.5" fill="#6B6F96">model.step()</text>
  <g><rect x="382" y="13" width="236" height="68" rx="14" fill="#FFFFFF" stroke="#E4E2F5" stroke-width="1.2"/><rect x="382" y="13" width="4" height="68" rx="2" fill="#7C5CFF"/><text x="400" y="41" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#141833">1 · Scenario</text><text x="400" y="63" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#6B6F96">n · width · seed</text><circle cx="598" cy="47" r="4" fill="#7C5CFF"/></g>
  <g><rect x="724" y="251" width="236" height="68" rx="14" fill="#FFFFFF" stroke="#E4E2F5" stroke-width="1.2"/><rect x="724" y="251" width="4" height="68" rx="2" fill="#12B5C9"/><text x="742" y="279" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#141833">2 · Step</text><text x="742" y="301" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#6B6F96">agents act</text><circle cx="940" cy="285" r="4" fill="#12B5C9"/></g>
  <g><rect x="382" y="489" width="236" height="68" rx="14" fill="#FFFFFF" stroke="#E4E2F5" stroke-width="1.2"/><rect x="382" y="489" width="4" height="68" rx="2" fill="#E0559F"/><text x="400" y="517" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#141833">3 · Record</text><text x="400" y="539" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#6B6F96">collect metrics</text><circle cx="598" cy="523" r="4" fill="#E0559F"/></g>
  <g><rect x="40" y="251" width="236" height="68" rx="14" fill="#FFFFFF" stroke="#E4E2F5" stroke-width="1.2"/><rect x="40" y="251" width="4" height="68" rx="2" fill="#E8A020"/><text x="58" y="279" font-family="Inter, 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#141833">4 · Visualize</text><text x="58" y="301" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#6B6F96">explore results</text><circle cx="256" cy="285" r="4" fill="#E8A020"/></g>
