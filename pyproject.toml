[build-system]
# setuptools only drives MSVC for the compiled modules on Windows (hatch_build.py).
requires = ["hatchling", "setuptools>=70 ; sys_platform == 'win32'"]
build-backend = "hatchling.build"

[project]
name = "modelly-abm"
description = "Agent-based modeling (ABM) framework for Python: typed scenarios, seeded reproducible runs, numpy-backed agents, grids, networks, continuous space, discrete-event time, pandas data collection and browser visualization"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
  { name = "Rémi Pelloux" },
  { name = "Modelly contributors" },
]
keywords = [
  "agent-based modeling",
  "agent-based model",
  "agent-based simulation",
  "ABM",
  "simulation",
  "multi-agent systems",
  "complex systems",
  "computational social science",
  "discrete-event simulation",
  "scientific computing",
  "numpy",
  "pandas",
  "mesa",
  "netlogo",
]
classifiers = [
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Life",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
]
readme = "README.md"
dependencies = [
  "numpy",
  "pandas",
  "tqdm",
  "scipy",
  "pythran>=0.17.0 ; sys_platform == 'darwin'", # required for darwin scipy overrides in nix

]
dynamic = ["version"]

[project.optional-dependencies]
# User collections
rec = ["modelly-abm[network,viz]"]
all = ["modelly-abm[network,viz,dev,examples,docs]"]
# Core dependencies
network = [
  "networkx",
]
# Geospatial space (modelly.space.geo): wheels on Windows, macOS and Linux, no system GDAL
geo = [
  "geopandas",
  "shapely",
  "pyproj",
  "rasterio",
  "pyarrow",  # GeoParquet export
]
# Road networks downloaded from OpenStreetMap (modelly.space.geo.download_osm)
osm = [
  "osmnx",
]
# modelly bench pins its runs to one core with psutil (Linux, Windows)
bench = [
  "psutil",
]
viz = [
  "matplotlib",
  "solara",
  "altair",
  "starlette<1.0",
]
# Experiments: Parquet results store and SQL queries (modelly.experiments, modelly.data.io)
experiments = [
  "pyarrow",
  "duckdb",
]
# Experiment executors
dask = [
  "modelly-abm[experiments]",
  "dask",
  "distributed",
]
ray = [
  "modelly-abm[experiments]",
  "ray",
]
# MP4 export of space views (modelly.viz.animation); imageio-ffmpeg bundles ffmpeg.
video = [
  "imageio",
  "imageio-ffmpeg",
]
# Dev and CI stuff
dev = [
  "modelly-abm[rec,geo,bench]",
  "ruff",
  "pytest",
  "pytest-cov",
  "hypothesis",
  "sphinx",
  "pytest-mock",
  "pytest-playwright",
  "pytest-ipywidgets",
  "playwright",
  "ipython>=9.2.0",
  "pyarrow",
  "modelly-abm[experiments]",
]
examples = [
  "modelly-abm[rec]",
  "pytest",
  "scipy",
]
docs = [
  "modelly-abm[rec,geo]",
  "sphinx",
  "ipython",
  "pydata_sphinx_theme",
  "seaborn",
  "myst-nb",
  "myst-parser",  # Markdown in Sphinx
  "sphinx-copybutton", # Add a copy option in docs
  "sphinxcontrib-mermaid",  # diagrams in the roadmap
]

[project.scripts]
modelly = "modelly.__main__:main"

[project.urls]
Homepage = "https://remipelloux.github.io/Modelly/"
Documentation = "https://remipelloux.github.io/Modelly/"
Repository = "https://github.com/RemiPelloux/Modelly"
Changelog = "https://github.com/RemiPelloux/Modelly/blob/main/CHANGELOG.md"
Issues = "https://github.com/RemiPelloux/Modelly/issues"

[tool.codespell]
ignore-words-list = ["ist", "hart", "nD"]

[tool.coverage.run]
source = ["."]
source_pkgs = ["modelly"]
relative_files = true
branch = true

[tool.coverage.paths]
_site-packages-to-flat-layout-mapping = [
  'modelly',
  '*/modelly',
  '*/lib/pypy*/site-packages/modelly',
  '*/lib/python*/site-packages/modelly',
  '*/Lib/site-packages/modelly',
]

[tool.hatch.build.targets.wheel]
packages = ["modelly"]
exclude = ["modelly/_native/*.c", "modelly/_native/*.h"]

# Compiles the modelly/_native C modules into platform wheels (optional, see hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.version]
path = "modelly/__init__.py"

[tool.ruff]
# See https://github.com/charliermarsh/ruff#rules for error code definitions.
# Hardcode to Python 3.12.
# Reminder to update modelly-examples if the value below is changed.
target-version = "py312"
extend-exclude = ["build", "benchmarks/notebooks/*.ipynb", "benchmarks/mesaVSmodelly"]  # generated notebooks; local-only harness

[tool.ruff.lint]
# Preview only for the rules selected by code below (PLW1514), not whole groups.
preview = true
explicit-preview-rules = true
select = [
  # "ANN", # annotations TODO
  "B",   # bugbear
  "C4",  # comprehensions
  "DTZ", # naive datetime
  "E",   # style errors
  "F",   # flakes
  "I",   # import sorting
  "ISC", # string concatenation
  "N",   # naming
  "PGH", # pygrep-hooks
  "PIE", # miscellaneous
  "PLC", # pylint convention
  "PLE", # pylint error
  # "PLR", # pylint refactor TODO
  "PLW", # pylint warning
  "PLW1514", # open() without encoding= (preview): Windows defaults to a legacy code page
  "Q",   # quotes
  "RUF", # Ruff
  "S",   # security
  "SIM", # simplify
  "T10", # debugger
  "UP",  # upgrade
  "W",   # style warnings
  "YTT", # sys.version
  "D",  # docstring
]
# Ignore list taken from https://github.com/psf/black/blob/master/.flake8
# E203	Whitespace before ':'
# E266	Too many leading '#' for block comment
# W503	Line break occurred before a binary operator
# But we don't specify them because ruff's formatter
# checks for it.
# See https://github.com/charliermarsh/ruff/issues/1842#issuecomment-1381210185
extend-ignore = [
  "E501",
  "S101",   # Use of `assert` detected
  "B017",   # `assertRaises(Exception)` should be considered evil TODO
  "PGH004", # Use specific rule codes when using `noqa` TODO
  "B905",   # `zip()` without an explicit `strict=` parameter
  "N802",   # Function name should be lowercase
  "N999",   # Invalid module name. We should revisit this in the future, TODO
  "S310",   # Audit URL open for permitted schemes. Allowing use of `file:` or custom schemes is often unexpected.
  "S603",   # `subprocess` call: check for execution of untrusted input
  "ISC001", # ruff format asks to disable this feature
  "S311",   # Standard pseudo-random generators are not suitable for cryptographic purposes
]
# `# noqa: MDL001` comments are for `python -m modelly.lint`, not ruff.
external = ["MDL"]
# Ignore all docstring errors in examples and tutorials
per-file-ignores = {"modelly/examples/*"= ["D"], "benchmarks/playbooks/*" = ["D102", "D107", "E741"], "benchmarks/ports/*" = ["D102", "D107"], "example.py" = ["D"], "docs/tutorials/*" = ["D", "E", "F", "N"], "docs/conf.py"=["C", "D", "DTZ011", "E"]}

[tool.ruff.lint.pydocstyle]
convention = "google"
