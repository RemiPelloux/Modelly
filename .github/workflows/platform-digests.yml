name: platform-digests
# The determinism suite on every platform and supported interpreter, and the exact
# digests of every example compared across all of them.
#
#   digests   on Linux (x86-64 and ARM64), macOS (ARM64 and x86-64) and Windows, with
#             CPython 3.12, 3.13 and 3.14: the determinism suite (golden digests, compiled
#             against pure Python, resumed against straight runs, split runs against one
#             process), then this build's exact (unrounded) digests of every example,
#             uploaded as an artifact
#   compare   downloads the digest files and reports, per example, whether the exact
#             digest is identical on every build (bit for bit) or only the rounded one is
#             (the golden suite's ten significant digits)
#
# `source` chooses what is tested: the checkout, with the compiled modules built on the
# runner, or the released wheel of `version` installed from PyPI (the checkout's package
# directory is removed first, so the tests import the installed wheel; the test files come
# from the checkout, which must be the tag the wheel was built from).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "checkout (build here) or pypi (the released wheel)"
        default: "checkout"
        type: choice
        options: [checkout, pypi]
      version:
        description: "the PyPI version to install when source is pypi"
        default: "1.4.2"
        type: string

permissions:
  contents: read

jobs:
  digests:
    name: Digests on ${{ matrix.runner }}, CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Modelly from the checkout (compiled modules built here)
        if: ${{ inputs.source != 'pypi' }}
        run: |
          pip install uv
          uv pip install --system ".[dev]"
      - name: Install the released wheel from PyPI
        if: ${{ inputs.source == 'pypi' }}
        shell: bash
        run: |
          pip install uv
          uv pip install --system "modelly-abm[dev]==${{ inputs.version }}"
          rm -rf modelly  # the tests must import the installed wheel, not the checkout
      - name: Which build is imported, and which modules compiled
        shell: bash
        run: |
          python - <<'EOF'
          import json, platform, sys
          import modelly
          from modelly._native import cells, events, loops, sets
          info = {
              "modelly": modelly.__version__,
              "file": modelly.__file__,
              "python": sys.version,
              "platform": platform.platform(),
              "machine": platform.machine(),
              "compiled": {"sets": sets.NATIVE, "cells": cells.NATIVE, "loops": loops.NATIVE, "events": events.NATIVE},
          }
          print(json.dumps(info, indent=1))
          json.dump(info, open("build-${{ matrix.runner }}-${{ matrix.python-version }}.json", "w"), indent=1)
          EOF
      - name: The determinism suite
        shell: bash
        run: pytest -rs -p no:cacheprovider -W default --durations=10 tests/determinism
      - name: This build's exact digests
        shell: bash
        run: |
          python -m modelly.dev golden --json > "digests-${{ matrix.runner }}-${{ matrix.python-version }}.json"
          python -c "import json,sys; d=json.load(open('digests-${{ matrix.runner }}-${{ matrix.python-version }}.json')); print(len(d), 'examples')"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}-${{ matrix.python-version }}
          path: |
            digests-*.json
            build-*.json

  compare:
    name: Compare the digests across platforms
    needs: digests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - name: Per example, where the exact digest agrees
        shell: bash
        run: |
          python - <<'EOF'
          import json, pathlib, collections
          files = sorted(pathlib.Path("digests").glob("digests-*.json"))
          data = {f.stem.removeprefix("digests-"): json.load(open(f)) for f in files}
          builds = {f.stem.removeprefix("build-"): json.load(open(f)) for f in pathlib.Path("digests").glob("build-*.json")}
          print(f"{len(data)} builds: {', '.join(data)}")
          for name, info in sorted(builds.items()):
              print(f"  {name:28s} {info['modelly']} {info['machine']:8s} compiled={all(info['compiled'].values())} {info['file']}")
          names = sorted(set().union(*(set(d) for d in data.values())))
          golden = json.load(open("tests/determinism/golden.json"))["examples"]
          exact_everywhere, rounded_only, missing = [], [], []
          for name in names:
              values = {b: d.get(name) for b, d in data.items()}
              present = {b: v for b, v in values.items() if v is not None}
              distinct = collections.Counter(present.values())
              digits = golden.get(name, {}).get("float_digits")
              status = "identical" if len(distinct) == 1 else f"{len(distinct)} distinct"
              print(f"{name:28s} present on {len(present)}/{len(data)}  exact digests: {status}  (golden: {'exact' if digits is None else f'{digits} digits'})")
              if len(present) < len(data):
                  missing.append(name)
              if len(distinct) == 1:
                  exact_everywhere.append(name)
              else:
                  rounded_only.append(name)
                  for b, v in present.items():
                      print(f"    {b:28s} {v}")
          summary = {"source": "${{ inputs.source }}", "version": "${{ inputs.version }}",
                     "builds": sorted(data), "build_info": builds, "exact_everywhere": exact_everywhere,
                     "not_bitwise": rounded_only, "not_on_every_build": missing}
          json.dump(summary, open("digests/summary.json", "w"), indent=1)
          print(json.dumps({k: v for k, v in summary.items() if k != "build_info"}, indent=1))
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: digests-summary
          path: digests/summary.json
