name: Release
# Wheels only on a release tag (which also publishes) or a manual run (build only).
on:
  push:
    tags:
    - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    # Platform wheels with the compiled modules (modelly/_native/fastrng.c, fastloop.c,
    # fastcell.c, fastset.c), for the GIL and the free-threaded interpreters.
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-* cp315-* cp314t-* cp315t-*"
          # The C modules declare Py_MOD_GIL_NOT_USED (see modelly/_native/ftcompat.h).
          CIBW_SKIP: "*-*linux_i686"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # Each Windows runner builds its own architecture only (AMD64 on windows-latest,
          # ARM64 on windows-11-arm): the build hook links for the running interpreter,
          # so a cross-compiled wheel would be mis-tagged and could not be tested.
          CIBW_ARCHS_WINDOWS: "native"
          CIBW_ENVIRONMENT: "MODELLY_REQUIRE_NATIVE=1"
          CIBW_TEST_COMMAND: >-
            python -c "import sys, sysconfig, modelly.core.rng as r, modelly._native.loops as l, modelly._native.cells as c, modelly._native.sets as s; assert r.NATIVE and l.NATIVE and c.NATIVE and s.NATIVE, 'compiled modules not active'; assert not (sysconfig.get_config_var('Py_GIL_DISABLED') and sys._is_gil_enabled()), 'a compiled module turned the GIL back on'"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  pure:
    # The sdist and a py3-none-any wheel: every other platform (PyPy, a Python or an
    # architecture without a wheel above) installs this and uses the pure-Python twins.
    name: Sdist and pure wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'
      - name: Install dependencies
        run: pip install -U pip hatch
      - name: Build distributions
        env:
          MODELLY_PURE_PYTHON: "1"
        run: hatch build
      - uses: actions/upload-artifact@v7
        with:
          name: pure
          path: dist/

  pyodide:
    # The WebAssembly row of the support matrix: the pure wheel installs with micropip in
    # Pyodide (CPython compiled to WebAssembly) under node, imports, uses the pure-Python
    # twins and runs a bundled example (scripts/pyodide-smoke.mjs).
    name: Pyodide smoke test
    needs: [pure]
    runs-on: ubuntu-latest
    env:
      PYODIDE_VERSION: "0.29.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pure
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Pyodide
        run: npm install --no-save --no-audit --no-fund "pyodide@${PYODIDE_VERSION}"
      - name: Install the pure wheel in Pyodide and run an example
        run: node scripts/pyodide-smoke.mjs dist/*-py3-none-any.whl

  release:
    name: Deploy release to PyPI
    needs: [wheels, pure, pyodide]
    runs-on: ubuntu-latest
    # The PyPI trusted publisher is bound to this environment (Settings > Environments).
    environment:
      name: pypi
      url: https://pypi.org/project/modelly-abm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -l dist
      - name: Upload package as artifact to GitHub
        if: github.repository == 'RemiPelloux/Modelly' && startsWith(github.ref, 'refs/tags')
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/
      - name: Publish package to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
