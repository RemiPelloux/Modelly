name: build

# Manual only: Modelly runs only the Release and docs workflows automatically; this
# check runs locally (scripts/ci-local.sh, scripts/release-checks.sh).
on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: False
      matrix:
        os: [windows, ubuntu, macos]
        python-version: ["3.14"]
        pip-pre: [""]
        include:
          - os: ubuntu
            python-version: "3.13"
          - os: ubuntu
            python-version: "3.12"
          - os: ubuntu
            python-version: "3.14"
            pip-pre: "--pre"
          # Disabled for now. See https://github.com/RemiPelloux/Modelly/issues/1253
          #- os: ubuntu
          #  python-version: 'pypy-3.8'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"
      - name: Install uv
        run: pip install uv
      - name: Install Modelly and dependencies
        run: uv pip install --system .[dev] ${{ matrix.pip-pre }}
      - name: Setup Playwright
        run: playwright install chromium-headless-shell
      - name: Test with pytest
        run: pytest --durations=10 tests/ -Werror -Wdefault::PendingDeprecationWarning

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install uv
      - run: uv pip install --system .[dev]
      - run: playwright install chromium-headless-shell
      - run: python -Im pytest -p pytest_cov --cov --cov-report=xml --cov-report=markdown-append:"${GITHUB_STEP_SUMMARY}" --cov-context=test tests/

  pure-python:
    # The suite once more with the compiled modules switched off, so the pure-Python
    # twins of modelly/_native (FastRandom, the agent-set loops, the neighbourhood walk,
    # the cell move) stay tested.
    runs-on: ubuntu-latest
    env:
      MODELLY_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install uv
      - run: uv pip install --system .[dev]
      - run: playwright install chromium-headless-shell
      - run: pytest --durations=10 tests/ -Werror -Wdefault::PendingDeprecationWarning


  browser:
    # Every example and zoo model exported with modelly export-web and run in a headless
    # Chromium with Pyodide (tests/web/test_browser.py, opt-in elsewhere): once with the
    # pure-Python wheel, once with the wheel whose C modules Emscripten compiled.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODELLY_BROWSER_TESTS: "1"
      PYODIDE_VERSION: "314.0.7" # modelly.web.export.PYODIDE_VERSION
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14" # the Python of Pyodide 314, as pyodide build requires
          cache: "pip"
      - run: pip install uv
      - run: uv pip install --system .[dev] pyodide-build
      - run: playwright install chromium-headless-shell
      - name: Build the WebAssembly wheel
        run: |
          pyodide xbuildenv install "$PYODIDE_VERSION"
          pyodide xbuildenv install-emscripten
          bash scripts/build-wasm-wheel.sh dist/wasm
          echo "MODELLY_WASM_WHEEL=$(ls dist/wasm/*.whl)" >> "$GITHUB_ENV"
      - name: Run the models in the browser
        run: pytest --durations=10 tests/web/test_browser.py
