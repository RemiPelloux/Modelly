# Vale Prose Linter GitHub Actions Workflow
name: Vale Prose Linter

# Manual only: Modelly runs only the Release and docs workflows automatically; this
# check runs locally (scripts/ci-local.sh, scripts/release-checks.sh).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: Run Vale
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Vale
        uses: errata-ai/vale-action@v3.0.0
        with:
          files: all
          vale_flags: "--minAlertLevel=warning"
          fail_on_error: false
          filter_mode: nofilter